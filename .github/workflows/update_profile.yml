name: Update profile animation

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - profile/config.json
      - assets/**
      - scripts/rasterize_logo.py
      - scripts/generate_profile.py
      - scripts/requirements.txt
      - tests/**
      - .github/workflows/update_profile.yml

permissions:
  contents: write

concurrency:
  group: update-profile-animation
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core python3-gi python3-cairo gir1.2-rsvg-2
          python -m pip install -r scripts/requirements.txt
      - name: Check renderer
        run: python -m unittest discover -s tests -v
      - name: Generate animation
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/generate_profile.py
      - name: Commit animation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/terminal.gif profile/data.json profile/render.sha256
          git diff --cached --quiet && exit 0
          git commit -m "Update profile animation"
          git pull --rebase
          git push
