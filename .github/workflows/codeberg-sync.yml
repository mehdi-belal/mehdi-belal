name: Codeberg sync

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
  workflow_run:
    workflows: ["Update profile animation"]
    types: [completed]

jobs:
  call-codeberg-sync:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    uses: arpanghosh8453/codeberg-sync/.github/workflows/codeberg-sync.yml@main
    secrets:
      CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
